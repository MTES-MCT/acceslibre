version: '3.5'
services:
  app:
    platform: linux/amd64
    build: .
    # Interactive debugging support (ipdb/pdb): allocate a TTY and keep stdin
    # open so that `docker attach` gives a live, raw terminal to the process.
    tty: true
    stdin_open: true
    environment:
      TERM: xterm-256color
    ports:
      - '7001:7000'
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    restart: unless-stopped
    depends_on:
      - database
      - redis
  database:
    container_name: access4all_postgresql
    image: postgis/postgis:17-master
    platform: linux/amd64
    environment:
      POSTGRES_DB: access4all
      POSTGRES_USER: access4all
      POSTGRES_PASSWORD: access4all
    ports:
      - 5532:5432
    restart: unless-stopped
    volumes:
      - ./data_psql:/data_psql
      # Comment this line if you don't want database data on your hosted volume
      - pgdata:/var/lib/postgresql/data
    ## uncomment to limit database resources
    # deploy:
    #     resources:
    #         limits:
    #           cpus: 0.05
    #           memory: 8G
  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - '6380:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass access4allpwd
    volumes:
      - redis:/data
volumes:
  redis:
    driver: local
  # Comment this line if you don't want database data on your hosted volume
  pgdata:
